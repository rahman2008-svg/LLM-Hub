workflows:
  android-native-build:
    name: Android Native AI Build
    max_build_duration: 60

    environment:
      java: 17

    scripts:
      - name: Grant permissions
        script: |
          chmod +x gradlew

      - name: Clean project
        script: |
          ./gradlew clean

      - name: Build Release APK
        script: |
          ./gradlew assembleRelease

    artifacts:
      - app/build/outputs/apk/**/*.apk