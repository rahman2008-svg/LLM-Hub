workflows:
  android-build:
    name: Android AI App Build
    max_build_duration: 60

    environment:
      vars:
        PACKAGE_NAME: "com.example.aiapp"
      flutter: stable
      java: 17

    scripts:
      - name: Get dependencies
        script: |
          flutter pub get

      - name: Run tests (optional)
        script: |
          flutter test || true

      - name: Build APK (Release)
        script: |
          flutter build apk --release

    artifacts:
      - build/**/outputs/apk/**/*.apk

    publishing:
      email:
        recipients:
          - your-email@example.com