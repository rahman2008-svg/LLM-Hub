workflows:
  android-native-build:
    name: Android Native AI Build

    working_directory: android

    environment:
      java: 17

    scripts:
      - name: Grant permissions
        script: |
          chmod +x ./gradlew

      - name: Clean project
        script: |
          ./gradlew clean

      - name: Build APK
        script: |
          ./gradlew assembleRelease

    artifacts:
      - app/build/outputs/apk/**/*.apk